<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Negconj Tree Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a working desk. Sentence list on the left, the selected sentence read like a statute
   page on the right, its tree drawn below. Red marks negation, indigo marks conjunction. */
:root {
  --paper: #f5f7f6;
  --surface: #ffffff;
  --ink: #1b2320;
  --muted: #5b6862;
  --rule: #d8dfdb;
  --accent: #23695a;
  --accent-soft: #e2efeb;
  --neg: #b3262f;
  --neg-soft: #f8e4e5;
  --conj: #3346b8;
  --conj-soft: #e6e9fa;
  --warn: #8a5a00;
  --warn-soft: #f6ecd6;
  --font-text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --font-ui: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --surface: #19201d; --ink: #e3e9e6; --muted: #97a39d; --rule: #2b3531;
    --accent: #72c2ab; --accent-soft: #1d322c; --neg: #ff7f86; --neg-soft: #3a1d20;
    --conj: #9daaff; --conj-soft: #22264a; --warn: #e2b55a; --warn-soft: #362a12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --surface: #19201d; --ink: #e3e9e6; --muted: #97a39d; --rule: #2b3531;
  --accent: #72c2ab; --accent-soft: #1d322c; --neg: #ff7f86; --neg-soft: #3a1d20;
  --conj: #9daaff; --conj-soft: #22264a; --warn: #e2b55a; --warn-soft: #362a12; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  display: grid; grid-template-rows: auto 1fr;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--surface);
}
header.top h1 { margin: 0; font: 600 17px/1.2 var(--font-ui); letter-spacing: .01em; }
header.top h1 em { font-style: normal; color: var(--neg); }
header.top h1 b { font-weight: 600; color: var(--conj); }
.runmeta { color: var(--muted); font: 12px var(--font-mono); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-left: auto; font-variant-numeric: tabular-nums; }
.stat { display: flex; gap: 6px; align-items: baseline; }
.stat .n { font: 600 15px var(--font-mono); }
.stat .l { color: var(--muted); font-size: 12px; }

main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; min-height: 0; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } body { height: auto; } }

/* ---------- list ---------- */
aside { border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.filters label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; min-width: 0; }
.filters input, .filters select { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 7px; min-width: 0; }
.filters .wide { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 1 / -1; }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 1px 8px; font: 12px var(--font-mono); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--conj-soft); border-color: var(--conj); color: var(--conj); }
.chip .c { color: var(--muted); margin-left: 4px; }
.count { padding: 6px 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 8px; }
.count button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }
#list { overflow-y: auto; flex: 1; min-height: 0; }
.row { display: grid; gap: 3px; padding: 9px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; border-left: 3px solid transparent; }
.row:hover { background: var(--paper); }
.row[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.row .cite { display: flex; gap: 8px; align-items: baseline; font: 12px var(--font-mono); }
.row .cite .rv { margin-left: auto; font-size: 11px; }
.row .snip { font: 14px/1.4 var(--font-text); color: var(--ink); overflow-wrap: anywhere; }
.row .snip .gap { color: var(--muted); }
.more { margin: 10px 16px; padding: 6px; width: calc(100% - 32px); border: 1px dashed var(--rule); background: none; border-radius: 4px; cursor: pointer; color: var(--accent); }

/* ---------- detail ---------- */
#detail { overflow-y: auto; min-height: 0; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1100px; display: grid; gap: 18px; }
.dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.dhead h2 { margin: 0; font: 600 22px/1.2 var(--font-text); text-wrap: balance; }
.pill { font: 500 11px var(--font-ui); text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.pill.flag { color: var(--neg); background: var(--neg-soft); }
.pill.relax { color: var(--warn); background: var(--warn-soft); }
.pill.none { color: var(--muted); }
.meta { color: var(--muted); font: 12px var(--font-mono); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta a { color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; }
.legend .l-neg::before { background: var(--neg); }
.legend .l-vp::before { background: var(--neg-soft); border: 1px solid var(--neg); }
.legend .l-conj::before { background: var(--conj); }
.legend .l-coord::before { border-bottom: 2px solid var(--conj); height: 6px; }

.text { font: 17px/1.75 var(--font-text); max-width: 75ch; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 20px; }
.text .t-vp { background: var(--neg-soft); }
.text .t-coord { box-shadow: inset 0 -2px 0 var(--conj); }
.text .t-not { color: var(--neg); font-weight: 600; }
.text .t-and { color: var(--conj); font-weight: 600; }
.text details { margin-top: 10px; font: 13px/1.5 var(--font-ui); color: var(--muted); }
.text details p { font: 14px/1.6 var(--font-text); color: var(--ink); margin: 6px 0 0; }

h3 { margin: 0 0 8px; font: 600 12px var(--font-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--paper); }
tbody tr[aria-selected="true"] { background: var(--accent-soft); }
td.ctx { font-family: var(--font-text); white-space: normal; min-width: 220px; max-width: 380px; }
td .yes { color: var(--neg); font-weight: 600; }
td .no { color: var(--muted); }
td.mono { font-family: var(--font-mono); }

.treebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.treebar h3 { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 10px; cursor: pointer; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.hint { color: var(--muted); font-size: 12px; }
.treebox { overflow: auto; max-height: 70vh; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); padding: 10px; }
svg.tree text { font-family: var(--font-mono); font-size: 12px; fill: var(--ink); }
svg.tree .lbl { fill: var(--muted); font-weight: 500; }
svg.tree line, svg.tree path.edge { stroke: var(--rule); stroke-width: 1.2; fill: none; }
svg.tree polygon.roof { fill: var(--paper); stroke: var(--muted); stroke-width: 1; cursor: pointer; }
svg.tree polygon.roof:hover { fill: var(--accent-soft); }
svg.tree text.yield { fill: var(--muted); font-family: var(--font-text); font-size: 12.5px; }
svg.tree .is-not text { fill: var(--neg); font-weight: 600; }
svg.tree .is-and text { fill: var(--conj); font-weight: 600; }
svg.tree .negvp rect { fill: var(--neg-soft); stroke: var(--neg); }
svg.tree .negvp text { fill: var(--neg); }
svg.tree .coord rect { fill: var(--conj-soft); stroke: var(--conj); }
svg.tree .coord text { fill: var(--conj); }
svg.tree .lca text.lbl { text-decoration: underline; }

.outline { font: 12.5px/1.6 var(--font-mono); }
.outline details { margin-left: 14px; }
.outline > details { margin-left: 0; }
.outline summary { cursor: pointer; list-style: none; }
.outline summary::-webkit-details-marker { display: none; }
.outline summary::before { content: "▸ "; color: var(--muted); }
.outline details[open] > summary::before { content: "▾ "; }
.outline .lb { font-weight: 500; }
.outline .y { color: var(--muted); font-family: var(--font-text); }
.outline details[open] > summary .y { display: none; }
.outline .pt { margin-left: 28px; }
.outline .pt .lb { color: var(--muted); }
.outline .o-not { color: var(--neg); font-weight: 600; }
.outline .o-and { color: var(--conj); font-weight: 600; }
.outline .o-negvp > summary .lb { color: var(--neg); background: var(--neg-soft); padding: 0 3px; border-radius: 2px; }
.outline .o-coord > summary .lb { color: var(--conj); background: var(--conj-soft); padding: 0 3px; border-radius: 2px; }

.review { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
.review .marks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.review .marks button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.review textarea { width: 100%; min-height: 54px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); padding: 6px 8px; resize: vertical; }
.review .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
kbd { font: 11px var(--font-mono); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--paper); }
.empty { color: var(--muted); padding: 40px 0; }
@media (prefers-reduced-motion: no-preference) { .row { transition: background .12s; } }
</style>
</head>
<body>
<header class="top">
  <h1>Negconj Tree Viewer · <em>not</em> … <b>and</b></h1>
  <span class="runmeta" id="runmeta"></span>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside>
    <div class="filters">
      <label class="wide" for="f-q">Search text or citation<input id="f-q" type="search" placeholder="e.g. shall not apply, 3553"></label>
      <label for="f-status">Status<select id="f-status">
        <option value="flagged">Flagged (C2 strict)</option>
        <option value="relaxed">Relaxed only</option>
        <option value="any">Strict or relaxed</option>
        <option value="unflagged">Not flagged</option>
        <option value="all">All matches</option>
      </select></label>
      <label for="f-title">Title<select id="f-title"><option value="">All titles</option></select></label>
      <label for="f-src">Unit type<select id="f-src"><option value="">All</option></select></label>
      <label for="f-review">My review<select id="f-review">
        <option value="">Any</option><option value="none">Not reviewed</option>
        <option value="yes">Negconj</option><option value="no">Not negconj</option><option value="unsure">Unsure</option>
      </select></label>
      <div class="chips" id="chips" aria-label="Coordination label of a strict pair"></div>
    </div>
    <div class="count"><span id="count"></span><button id="clear" type="button">Clear filters</button></div>
    <div id="list" role="listbox" aria-label="Sentences"></div>
  </aside>
  <section id="detail" aria-live="polite"><div class="inner"><p class="empty">Select a sentence.</p></div></section>
</main>
<script>
const DATA = /*__DATA__*/null;
const ROWS = DATA.rows.map(r => ({ id: r[0], title: r[1], ident: r[2] || "", src: r[3], toks: r[4], tree: r[5],
  flagged: r[6], relaxed: r[7], pairs: r[8].map(p => ({ not: p[0], and: p[1], notParent: p[2], notRelaxedParent: p[3],
  coord: p[4], conj: p[5], dist: p[6], strict: p[7], rel: p[8] })) }));
const BRK = { "-LRB-": "(", "-RRB-": ")", "-LSB-": "[", "-RSB-": "]", "-LCB-": "{", "-RCB-": "}" };
const word = w => BRK[w] || w;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

/* ---------- citation helpers ---------- */
function citation(ident) {
  const m = /^\/us\/usc\/t(\w+)\/s([^/]+)((?:\/[^/]+)*)$/.exec(ident);
  if (!m) return ident || "(no identifier)";
  const sub = m[3].split("/").filter(Boolean).map(x => `(${x})`).join("");
  const t = m[1].replace(/^0+/, "");
  return `${t.endsWith("a") ? t.slice(0, -1) + " U.S.C. App." : t + " U.S.C."} § ${m[2]}${sub}`;
}
function liiUrl(ident) {
  const m = /^\/us\/usc\/t(\d+)\/s([^/]+)/.exec(ident);
  return m ? `https://www.law.cornell.edu/uscode/text/${+m[1]}/${m[2].replace(/–/g, "-")}` : null;
}

/* ---------- trees ---------- */
const treeCache = new Map();
function parseTree(s) {
  if (treeCache.has(s)) return treeCache.get(s);
  const t = s.match(/\(|\)|[^\s()]+/g); let i = 0, leaf = 0; const pts = [];
  function node(parent) {
    i++; const n = { label: t[i++], parent, kids: [] };
    while (t[i] !== ")") {
      if (t[i] === "(") n.kids.push(node(n)); else { n.word = t[i++]; n.idx = leaf++; pts.push(n); }
    }
    i++; n.lo = n.word !== undefined ? n.idx : n.kids[0].lo; n.hi = n.word !== undefined ? n.idx : n.kids[n.kids.length - 1].hi;
    return n;
  }
  const root = node(null); const res = { root, pts }; treeCache.set(s, res); return res;
}
function ancestors(n) { const a = []; for (let p = n; p; p = p.parent) a.push(p); return a; }
function lca(a, b) { const s = new Set(ancestors(a)); for (let p = b; p; p = p.parent) if (s.has(p)) return p; return null; }
function relaxedParent(n) { let p = n.parent; while (p && p.kids.length === 1) p = p.parent; return p; }
function yieldText(n, toks, max = 60) {
  const s = toks.slice(n.lo, n.hi + 1).map(word).join(" ");
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}
function pairNodes(row, pair) {
  const { root, pts } = parseTree(row.tree);
  const notN = pts[pair.not], cc = pts[pair.and];
  return { root, pts, notN, cc, coord: cc.parent, negVP: notN.parent, relaxedVP: relaxedParent(notN), top: lca(notN, cc.parent) };
}

/* ---------- state ---------- */
const KEY = "negconj-review:" + DATA.run;
let reviews = {};
try { reviews = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { reviews = {}; }
function saveReviews() { try { localStorage.setItem(KEY, JSON.stringify(reviews)); } catch (e) { /* storage unavailable */ } }
const st = { q: "", status: "flagged", title: "", src: "", review: "", coord: "", limit: 300, sel: null, pair: 0, view: "focus", expandAll: false, open: new Set() };

/* ---------- header + filters ---------- */
function natKey(t) { const m = /^(\d+)(.*)$/.exec(t); return m ? [+m[1], m[2]] : [1e9, t]; }
function setup() {
  const m = DATA.manifest || {};
  $("runmeta").textContent = [DATA.run, m.release_point && "release " + m.release_point,
    m.git_commit && "commit " + String(m.git_commit).slice(0, 8)].filter(Boolean).join(" · ");
  const nStrict = ROWS.filter(r => r.flagged).length, nRel = ROWS.filter(r => r.relaxed && !r.flagged).length;
  const stats = [[DATA.n_total, "matched sentences"], [nStrict, "flagged (strict)"], [nRel, "relaxed only"]];
  if (DATA.only_flagged) stats.push(["", "file holds flagged sentences only"]);
  $("stats").innerHTML = stats.map(([n, l]) => `<span class="stat"><span class="n">${n === "" ? "" : n.toLocaleString()}</span><span class="l">${l}</span></span>`).join("");
  const titles = [...new Set(ROWS.map(r => r.title))].sort((a, b) => { const x = natKey(a), y = natKey(b); return x[0] - y[0] || (x[1] < y[1] ? -1 : 1); });
  $("f-title").insertAdjacentHTML("beforeend", titles.map(t => `<option value="${esc(t)}">Title ${esc(t.replace(/^0+/, ""))}</option>`).join(""));
  const srcs = [...new Set(ROWS.map(r => r.src))].sort();
  $("f-src").insertAdjacentHTML("beforeend", srcs.map(s => `<option value="${esc(s)}">${esc(s.replace("_", " "))}</option>`).join(""));
  const cc = {}; ROWS.forEach(r => new Set(r.pairs.filter(p => p.strict).map(p => p.coord)).forEach(c => cc[c] = (cc[c] || 0) + 1));
  $("chips").innerHTML = `<span class="hint" style="width:100%">Coordination label of a strict pair</span>` +
    Object.entries(cc).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}<span class="c">${n}</span></button>`).join("");
  $("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; st.coord = st.coord === b.dataset.c ? "" : b.dataset.c; refresh(); });
  for (const [id, k] of [["f-q", "q"], ["f-status", "status"], ["f-title", "title"], ["f-src", "src"], ["f-review", "review"]])
    $(id).addEventListener("input", e => { st[k] = e.target.value; st.limit = 300; refresh(); });
  $("clear").addEventListener("click", () => { Object.assign(st, { q: "", status: "flagged", title: "", src: "", review: "", coord: "", limit: 300 });
    $("f-q").value = ""; $("f-status").value = "flagged"; $("f-title").value = ""; $("f-src").value = ""; $("f-review").value = ""; refresh(); });
}

function matches(r) {
  if (st.status === "flagged" && !r.flagged) return false;
  if (st.status === "relaxed" && !(r.relaxed && !r.flagged)) return false;
  if (st.status === "any" && !(r.flagged || r.relaxed)) return false;
  if (st.status === "unflagged" && (r.flagged || r.relaxed)) return false;
  if (st.title && r.title !== st.title) return false;
  if (st.src && r.src !== st.src) return false;
  if (st.coord && !r.pairs.some(p => p.strict && p.coord === st.coord)) return false;
  if (st.review) { const m = (reviews[r.id] || {}).mark || "none"; if (m !== st.review) return false; }
  if (st.q) { const q = st.q.toLowerCase(); if (!(r.ident.toLowerCase().includes(q) || citation(r.ident).toLowerCase().includes(q) || r.toks.join(" ").toLowerCase().includes(q))) return false; }
  return true;
}
function keyPair(r) {
  const i = r.pairs.findIndex(p => p.strict); if (i >= 0) return i;
  const j = r.pairs.findIndex(p => p.rel); if (j >= 0) return j;
  const k = r.pairs.findIndex(p => p.not < p.and); return k >= 0 ? k : 0;
}
function snippetFull(r) {
  const p = r.pairs[keyPair(r)];
  if (!p) return esc(r.toks.slice(0, 24).map(word).join(" "));
  const mark = (i) => i === p.not ? "neg" : i === p.and ? "conj" : null;
  const span = (a, b) => { const out = []; for (let i = Math.max(0, a); i < Math.min(r.toks.length, b); i++) { const c = mark(i); out.push(c ? `<span style="color:var(--${c});font-weight:600">${esc(word(r.toks[i]))}</span>` : esc(word(r.toks[i]))); } return out.join(" "); };
  return p.and - p.not <= 12 && p.and > p.not ? span(p.not - 4, p.and + 5) : span(p.not - 4, p.not + 5) + ` <span class="gap">…</span> ` + span(p.and - 4, p.and + 5);
}
const REVIEW_LABEL = { yes: "✓ negconj", no: "✗ not negconj", unsure: "? unsure" };

let filtered = [];
function refresh() {
  document.querySelectorAll("#chips .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === st.coord)));
  filtered = ROWS.filter(matches);
  $("count").textContent = `${filtered.length.toLocaleString()} sentence${filtered.length === 1 ? "" : "s"}`;
  const shown = filtered.slice(0, st.limit);
  $("list").innerHTML = shown.map(r => {
    const rv = (reviews[r.id] || {}).mark;
    return `<div class="row" role="option" data-id="${esc(r.id)}" aria-selected="${r.id === st.sel}">
      <div class="cite"><span>${esc(citation(r.ident))}</span><span style="color:var(--muted)">${esc(r.src === "chapeau_condensed" ? "chapeau" : r.src)}</span>${rv ? `<span class="rv">${REVIEW_LABEL[rv]}</span>` : ""}</div>
      <div class="snip">${snippetFull(r)}</div></div>`;
  }).join("") + (filtered.length > st.limit ? `<button class="more" type="button" id="more">Show ${Math.min(300, filtered.length - st.limit)} more</button>` : "");
  if (!filtered.length) $("list").innerHTML = `<p class="empty" style="padding:20px 16px">No sentences match these filters.</p>`;
  const more = $("more"); if (more) more.addEventListener("click", () => { st.limit += 300; refresh(); });
  if (!filtered.some(r => r.id === st.sel) && filtered.length) select(filtered[0].id, false);
}
$("list").addEventListener("click", e => { const row = e.target.closest(".row"); if (row) select(row.dataset.id, false); });

/* ---------- detail ---------- */
function select(id, scroll = true) {
  st.sel = id; const r = ROWS.find(x => x.id === id); st.pair = keyPair(r); st.expandAll = false; st.open = new Set();
  document.querySelectorAll("#list .row").forEach(el => el.setAttribute("aria-selected", String(el.dataset.id === id)));
  if (scroll) { const el = document.querySelector(`#list .row[data-id="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: "nearest" }); }
  renderDetail();
}
function renderDetail() {
  const r = ROWS.find(x => x.id === st.sel); if (!r) return;
  const p = r.pairs[st.pair]; const nodes = p ? pairNodes(r, p) : null;
  const pill = r.flagged ? `<span class="pill flag">Flagged · C2 strict</span>` : r.relaxed ? `<span class="pill relax">Relaxed only</span>` : `<span class="pill none">Not flagged</span>`;
  const lii = liiUrl(r.ident);
  // sentence with highlights for the selected pair
  const vp = nodes && (p.strict ? nodes.negVP : (p.rel ? nodes.relaxedVP : null));
  const inVP = i => vp && i >= vp.lo && i <= vp.hi, inCo = i => nodes && i >= nodes.coord.lo && i <= nodes.coord.hi;
  const textHtml = r.toks.map((w, i) => {
    const cls = [];
    if (inVP(i)) cls.push("t-vp");
    if (inCo(i)) cls.push("t-coord");
    if (p && i === p.not) cls.push("t-not");
    if (p && i === p.and) cls.push("t-and");
    const tok = cls.length ? `<span class="${cls.join(" ")}">${esc(word(w))}</span>` : esc(word(w));
    if (i === r.toks.length - 1) return tok;
    // the space after a token joins the shading when both neighbours share it
    const sc = [inVP(i) && inVP(i + 1) ? "t-vp" : "", inCo(i) && inCo(i + 1) ? "t-coord" : ""].filter(Boolean);
    return tok + (sc.length ? `<span class="${sc.join(" ")}"> </span>` : " ");
  }).join("");
  const strictN = r.pairs.filter(q => q.strict).length;
  const pairRows = r.pairs.map((q, i) => {
    const a = Math.max(0, q.not - 2), b = Math.min(r.toks.length, q.not + 3), c = Math.max(0, q.and - 2), d = Math.min(r.toks.length, q.and + 3);
    const show = (s, e, hi, col) => r.toks.slice(s, e).map((w, k) => s + k === hi ? `<span style="color:var(--${col});font-weight:600">${esc(word(w))}</span>` : esc(word(w))).join(" ");
    return `<tr data-i="${i}" aria-selected="${i === st.pair}">
      <td class="ctx">${show(a, b, q.not, "neg")} <span style="color:var(--muted)">…</span> ${show(c, d, q.and, "conj")}</td>
      <td class="mono">${esc(q.notParent)}${q.notRelaxedParent !== q.notParent ? ` → ${esc(q.notRelaxedParent)}` : ""}</td>
      <td class="mono">${esc(q.coord)}</td><td>${q.conj}</td><td>${q.dist}</td>
      <td>${q.strict ? `<span class="yes">yes</span>` : `<span class="no">no</span>`}</td>
      <td>${q.rel ? `<span class="yes">yes</span>` : `<span class="no">no</span>`}</td></tr>`;
  }).join("");
  const rv = reviews[r.id] || {};
  $("detail").querySelector(".inner").innerHTML = `
    <div class="dhead"><h2>${esc(citation(r.ident))}</h2>${pill}</div>
    <div class="meta"><span>${esc(r.src.replace("_", " "))}</span><span>${r.toks.length} tokens</span>
      <span>${r.pairs.length} (not, and) pair${r.pairs.length === 1 ? "" : "s"}, ${strictN} strict</span>
      <span>${esc(r.id)}</span>${lii ? `<a href="${lii}" target="_blank" rel="noopener">Open on LII ↗</a>` : ""}</div>
    <div class="legend"><span class="l-neg">not</span><span class="l-vp">VP headed by not (pair satisfies C2)</span><span class="l-conj">and</span><span class="l-coord">coordination node</span></div>
    <div class="text">${textHtml}</div>
    <div><h3>(not, and) pairs · click one to draw it</h3><div class="tablewrap"><table>
      <thead><tr><th>pair in context</th><th>not's parent</th><th>coordination</th><th>conjuncts</th><th>distance</th><th>C2 strict</th><th>C2 relaxed</th></tr></thead>
      <tbody>${pairRows || `<tr><td colspan="7" class="no">No CC "and" in this parse.</td></tr>`}</tbody></table></div></div>
    <div>
      <div class="treebar"><h3>Tree</h3>
        <span class="seg"><button type="button" data-v="focus" aria-pressed="${st.view === "focus"}">Pair view</button><button type="button" data-v="outline" aria-pressed="${st.view === "outline"}">Full outline</button></span>
        <button type="button" class="btn" id="t-toggle">${st.view === "focus" ? (st.expandAll ? "Fold unrelated branches" : "Unfold all") : "Expand all"}</button>
        <span class="hint" id="t-hint"></span></div>
      <div class="treebox" id="treebox"></div></div>
    <div class="review"><h3 style="margin:0">My review</h3>
      <div class="marks">
        <button type="button" class="btn" data-m="yes" aria-pressed="${rv.mark === "yes"}">Negative conjunction <kbd>1</kbd></button>
        <button type="button" class="btn" data-m="no" aria-pressed="${rv.mark === "no"}">Not a negconj <kbd>2</kbd></button>
        <button type="button" class="btn" data-m="unsure" aria-pressed="${rv.mark === "unsure"}">Unsure <kbd>3</kbd></button></div>
      <label for="r-note" class="hint">Notes (scope reading, parser error, …)</label>
      <textarea id="r-note">${esc(rv.note || "")}</textarea>
      <div class="foot"><span class="hint">Saved in this browser only. <kbd>j</kbd>/<kbd>k</kbd> next/previous sentence.</span>
        <button type="button" class="btn" id="export">Export reviews (CSV)</button></div></div>`;
  const inner = $("detail").querySelector(".inner");
  inner.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.addEventListener("click", () => { st.pair = +tr.dataset.i; st.open = new Set(); renderDetail(); }));
  inner.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { st.view = b.dataset.v; st.expandAll = false; renderDetail(); }));
  $("t-toggle").addEventListener("click", () => { st.expandAll = !st.expandAll; renderDetail(); });
  inner.querySelectorAll(".marks button").forEach(b => b.addEventListener("click", () => setMark(b.dataset.m)));
  $("r-note").addEventListener("input", e => { reviews[r.id] = { ...(reviews[r.id] || {}), note: e.target.value }; saveReviews(); });
  $("export").addEventListener("click", exportCsv);
  if (nodes) (st.view === "focus" ? drawFocus : drawOutline)(r, p, nodes);
  else $("treebox").innerHTML = `<pre class="outline">${esc(r.tree)}</pre>`;
}
function setMark(m) {
  const r = ROWS.find(x => x.id === st.sel); if (!r) return;
  const cur = reviews[r.id] || {}; reviews[r.id] = { ...cur, mark: cur.mark === m ? undefined : m }; saveReviews();
  renderDetail(); const row = document.querySelector(`#list .row[data-id="${CSS.escape(r.id)}"] .cite`);
  if (row) { const old = row.querySelector(".rv"); if (old) old.remove(); const v = reviews[r.id].mark; if (v) row.insertAdjacentHTML("beforeend", `<span class="rv">${REVIEW_LABEL[v]}</span>`); }
}
function exportCsv() {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["sent_id", "citation", "identifier", "flagged", "flagged_relaxed", "review", "notes"].join(",")];
  ROWS.forEach(r => { const v = reviews[r.id]; if (v && (v.mark || v.note)) lines.push([q(r.id), q(citation(r.ident)), q(r.ident), r.flagged, r.relaxed, q(v.mark || ""), q(v.note || "")].join(",")); });
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
  a.download = `negconj_reviews_${DATA.run}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- pair view (SVG) ---------- */
let measureCtx;
function tw(s, font = "12px 'IBM Plex Mono', monospace") { measureCtx = measureCtx || document.createElement("canvas").getContext("2d"); measureCtx.font = font; return measureCtx.measureText(s).width; }
function drawFocus(r, p, nodes) {
  const top = nodes.top; const nLeaves = top.hi - top.lo + 1;
  const open = new Set(st.open);
  for (const n of [...ancestors(nodes.notN), ...ancestors(nodes.cc)]) open.add(n);
  const showAll = st.expandAll && nLeaves <= 600;
  const isOpen = n => showAll || open.has(n);
  $("t-hint").textContent = `${top.label} spanning ${nLeaves} tokens · click a triangle to unfold it` + (st.expandAll && !showAll ? " · too large to unfold fully" : "");
  // depth and leaf slots
  const items = []; let x = 0, maxDepth = 0; const GAP = 14;
  function lay(n, d) {
    maxDepth = Math.max(maxDepth, d);
    if (n.word !== undefined) {
      const w = Math.max(tw(n.label), tw(word(n.word))) + GAP; n._x = x + w / 2; n._w = w; n._d = d; n._kind = "pt"; x += w; return;
    }
    if (n !== top && !isOpen(n)) {
      const y = yieldText(n, r.toks, 46); const w = Math.max(tw(n.label), tw(y, "12.5px 'Source Serif 4', serif"), 34) + GAP;
      n._x = x + w / 2; n._w = w; n._d = d; n._kind = "roof"; n._y = y; x += w; return;
    }
    n._kind = "open"; n._d = d; n.kids.forEach(k => lay(k, d + 1)); n._x = (n.kids[0]._x + n.kids[n.kids.length - 1]._x) / 2;
  }
  lay(top, 0);
  const ROW = 44, PAD = 16, leafY = (maxDepth + 1) * ROW + PAD;
  const H = leafY + 30, W = x + PAD * 2;
  const parts = [];
  function draw(n) {
    const cx = n._x + PAD, cy = n._d * ROW + PAD + 12;
    let cls = "";
    if (n === nodes.negVP) cls += " negvp"; if (n === nodes.coord) cls += " coord"; if (n === top) cls += " lca";
    if (n === nodes.notN) cls += " is-not"; if (n === nodes.cc) cls += " is-and";
    if (n._kind === "open") n.kids.forEach(k => { parts.push(`<line x1="${cx}" y1="${cy + 5}" x2="${k._x + PAD}" y2="${k._d * ROW + PAD}"/>`); draw(k); });
    const lw = tw(n.label) + 8, boxed = n === nodes.negVP || n === nodes.coord;
    parts.push(`<g class="${cls.trim()}">${boxed ? `<rect x="${cx - lw / 2}" y="${cy - 12}" width="${lw}" height="17" rx="3"/>` : ""}<text class="lbl" x="${cx}" y="${cy}" text-anchor="middle">${esc(n.label)}</text>`);
    if (n._kind === "pt") parts.push(`<line x1="${cx}" y1="${cy + 5}" x2="${cx}" y2="${leafY - 12}"/><text x="${cx}" y="${leafY}" text-anchor="middle">${esc(word(n.word))}</text>`);
    if (n._kind === "roof") parts.push(`<polygon class="roof" data-key="${n.lo}-${n.hi}-${n.label}" points="${cx},${cy + 6} ${cx - n._w / 2 + 6},${leafY - 13} ${cx + n._w / 2 - 6},${leafY - 13}"><title>Unfold ${esc(n.label)}</title></polygon><text class="yield" x="${cx}" y="${leafY}" text-anchor="middle">${esc(n._y)}</text>`);
    parts.push(`</g>`);
  }
  draw(top);
  $("treebox").innerHTML = `<svg class="tree" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Constituency subtree for the selected pair">${parts.join("")}</svg>`;
  const byKey = new Map(); (function idx(n) { if (n.word === undefined) { byKey.set(`${n.lo}-${n.hi}-${n.label}`, n); n.kids.forEach(idx); } })(top);
  $("treebox").querySelectorAll("polygon.roof").forEach(pg => pg.addEventListener("click", () => { const n = byKey.get(pg.dataset.key); if (n) { st.open.add(n); drawFocus(r, p, nodes); } }));
  const t = $("treebox").querySelector(".negvp, .is-not"); if (t && t.getBBox) { const b = t.getBBox(); $("treebox").scrollLeft = Math.max(0, b.x - 120); }
}

/* ---------- full outline ---------- */
function drawOutline(r, p, nodes) {
  const onPath = new Set([...ancestors(nodes.notN), ...ancestors(nodes.cc)]);
  const all = st.expandAll;
  $("t-hint").textContent = "Branches on the path to the selected not and and are open";
  function out(n) {
    if (n.word !== undefined) {
      const c = n === nodes.notN ? "o-not" : n === nodes.cc ? "o-and" : "";
      return `<div class="pt ${c}"><span class="lb">${esc(n.label)}</span> ${esc(word(n.word))}</div>`;
    }
    const c = (n === nodes.negVP ? " o-negvp" : "") + (n === nodes.coord ? " o-coord" : "");
    return `<details class="${c.trim()}"${all || onPath.has(n) ? " open" : ""}><summary><span class="lb">${esc(n.label)}</span> <span class="y">${esc(yieldText(n, r.toks, 90))}</span></summary>${n.kids.map(out).join("")}</details>`;
  }
  $("treebox").innerHTML = `<div class="outline">${out(nodes.root)}</div>`;
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = filtered.findIndex(r => r.id === st.sel);
  if (e.key === "j" || e.key === "ArrowDown") { if (i < filtered.length - 1) { if (i + 1 >= st.limit) { st.limit += 300; refresh(); } select(filtered[i + 1].id); } e.preventDefault(); }
  else if (e.key === "k" || e.key === "ArrowUp") { if (i > 0) select(filtered[i - 1].id); e.preventDefault(); }
  else if (e.key === "1") setMark("yes"); else if (e.key === "2") setMark("no"); else if (e.key === "3") setMark("unsure");
});

setup(); refresh();
</script>
</body>
